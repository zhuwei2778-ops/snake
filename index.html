<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; padding: 12px 16px 4px; }
  .stat { font-size: 15px; color: #94a3b8; }
  .stat b { color: #4ade80; font-size: 17px; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1e293b; border: 2px solid #334155; border-radius: 8px; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(15, 23, 42, .82); border-radius: 8px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 28px; color: #f87171; }
  #overlay p { color: #cbd5e1; font-size: 15px; }
  button {
    background: #4ade80; color: #052e16; border: none; border-radius: 999px;
    font-size: 17px; font-weight: 700; padding: 12px 36px; cursor: pointer;
  }
  button:active { transform: scale(.96); }
  #hint { color: #64748b; font-size: 12px; padding: 10px 0 14px; }
  #pad { display: grid; grid-template: repeat(2, 64px) / repeat(3, 64px); gap: 8px; padding-bottom: 20px; }
  #pad.hidden { display: none; }
  .btn {
    background: #334155; border-radius: 12px; font-size: 24px; color: #e2e8f0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .btn:active { background: #475569; }
  #up { grid-area: 1 / 2; } #left { grid-area: 2 / 1; } #down { grid-area: 2 / 2; } #right { grid-area: 2 / 3; }
  @media (min-width: 768px) { #pad { display: none; } }
</style>
</head>
<body>
  <header>
    <div class="stat">得分 <b id="score">0</b></div>
    <div class="stat">最高 <b id="best">0</b></div>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h1>🐍 贪吃蛇</h1>
      <p id="msg">滑动屏幕或按方向键控制</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="hint">滑动屏幕 或 点击下方方向键（电脑端用键盘 ↑↓←→ / WASD）</div>
  <div id="pad" class="hidden">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="down">▼</div>
    <div class="btn" id="right">▶</div>
  </div>

<script>
(function () {
  var N = 20;                 // 20x20 网格
  var speed = 140;            // 每步毫秒
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var cell, size;

  function fit() {
    var avail = Math.min(window.innerWidth - 24, window.innerHeight - 240, 480);
    size = Math.floor(avail / N);
    cv.width = cv.height = N * size;
    cell = cv.width / N;
    draw();
  }
  window.addEventListener('resize', fit);

  var snake, dir, nextDir, food, score, best, timer, running = false;
  var overlay = document.getElementById('overlay');
  var msg = document.getElementById('msg');
  var bestEl = document.getElementById('best');
  best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  bestEl.textContent = best;

  function newFood() {
    while (true) {
      food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      var on = snake.some(function (s) { return s.x === food.x && s.y === food.y; });
      if (!on) return;
    }
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0;
    document.getElementById('score').textContent = 0;
    newFood();
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('score').textContent = score;
      newFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    stop();
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', String(best));
      bestEl.textContent = best;
    }
    msg.textContent = '本局得分 ' + score + '（最高 ' + best + '）';
    document.querySelector('#overlay h1').textContent = '💀 游戏结束';
    document.getElementById('startBtn').textContent = '再来一局';
    overlay.classList.remove('hidden');
    document.getElementById('pad').classList.add('hidden');
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add('hidden');
    document.getElementById('pad').classList.remove('hidden');
    clearInterval(timer);
    timer = setInterval(step, speed);
    draw();
  }

  function stop() {
    running = false;
    clearInterval(timer);
  }

  function turn(x, y) {
    if (!running) return;
    if (x !== 0 && x !== -dir.x) nextDir = { x: x, y: y };
    else if (y !== 0 && y !== -dir.y) nextDir = { x: x, y: y };
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('up').addEventListener('click', function () { turn(0, -1); });
  document.getElementById('down').addEventListener('click', function () { turn(0, 1); });
  document.getElementById('left').addEventListener('click', function () { turn(-1, 0); });
  document.getElementById('right').addEventListener('click', function () { turn(1, 0); });

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') turn(0, -1);
    else if (k === 'arrowdown' || k === 's') turn(0, 1);
    else if (k === 'arrowleft' || k === 'a') turn(-1, 0);
    else if (k === 'arrowright' || k === 'd') turn(1, 0);
    else if (k === ' ' && !running) start();
  });

  var tx = 0, ty = 0, touching = false;
  var wrap = document.getElementById('wrap');
  wrap.addEventListener('touchstart', function (e) {
    touching = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  wrap.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  wrap.addEventListener('touchend', function (e) {
    if (!touching) return; touching = false;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  function draw() {
    if (!cell) return;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1;
    for (var i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(cv.width, i * cell); ctx.stroke();
    }
    ctx.fillStyle = '#f87171';
    round(food.x, food.y);
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      round(s.x, s.y);
    });
  }

  function round(x, y) {
    var p = 1.5;
    ctx.beginPath();
    ctx.roundRect(x * cell + p, y * cell + p, cell - p * 2, cell - p * 2, 4);
    ctx.fill();
  }

  fit();
  reset();
})();
</script>
</body>
</html>
